version: '3'
services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - PORT=8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: gamedate
      POSTGRES_USER: gamedate
      POSTGRES_PASSWORD: gamedate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamedate -d gamedate"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
